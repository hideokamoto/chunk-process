name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'libs/**'
      - 'tsconfig.json'
      - '.github/workflows/deploy-docs.yml'
  # The Releases page fetches GitHub Releases at build time; rebuild whenever one changes
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          # On release events github.ref is the release tag; build from main so the docs are not stale.
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml

      # TypeDoc type-checks ../libs/index.ts, which resolves @types/node from the root node_modules
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: .

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v6

      - run: pnpm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
